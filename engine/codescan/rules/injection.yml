rules:
  - id: sql-injection-string-concat
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      A SQL query string built via concatenation with a variable flows into
      cursor.execute() — this is SQL injection if that variable is ever
      attacker-influenced, even when the concatenation happens on an
      earlier line than the execute() call. Use parameterized queries
      (cursor.execute(query, (param,))) instead of building the query
      string yourself.
    metadata:
      cwe: "CWE-89"
      category: injection
      hazard_point: 9
    pattern-sources:
      - pattern: "... + $VAR + ..."
      - pattern: "\"...\" + $VAR"
      - pattern: $VAR + "..."
    pattern-sinks:
      - pattern: $CURSOR.execute($QUERY, ...)
        focus-metavariable: $QUERY
    pattern-propagators:
      - pattern: $A = $B
        from: $B
        to: $A

  - id: sql-injection-fstring
    languages: [python]
    severity: ERROR
    message: >-
      An f-string (or .format()/% string) is being interpolated directly
      into a SQL query. This is SQL injection if any interpolated value can
      be influenced by a user. Use parameterized queries instead of string
      formatting for SQL.
    metadata:
      cwe: "CWE-89"
      category: injection
      hazard_point: 9
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"...{$VAR}...")
          - pattern: $CURSOR.execute("...{}...".format($VAR))
          - pattern: $CURSOR.execute("...%s..." % $VAR)

  - id: shell-injection-subprocess
    languages: [python]
    severity: ERROR
    message: >-
      subprocess called with shell=True and a value that is not a fixed
      string literal allows shell injection — an attacker-controlled value
      can break out of the intended command using shell metacharacters
      (;, |, &&, $(...), backticks). Pass a list of arguments and omit
      shell=True, or use shlex.quote() if a shell is unavoidable.
    metadata:
      cwe: "CWE-78"
      category: injection
      hazard_point: 9
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, shell=True, ...)
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: subprocess.Popen($CMD, shell=True, ...)
          - pattern: subprocess.check_output($CMD, shell=True, ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: "\"...\""

  - id: os-system-call
    languages: [python]
    severity: WARNING
    message: >-
      os.system() runs through a shell and is vulnerable to shell injection
      if any part of the command string is influenced by external input.
      Prefer subprocess.run([...]) with a list of arguments and no shell.
    metadata:
      cwe: "CWE-78"
      category: injection
      hazard_point: 7
    patterns:
      - pattern: os.system(...)

  - id: eval-on-input
    languages: [python]
    severity: ERROR
    message: >-
      eval() executes arbitrary Python code. If the argument is influenced
      by external input in any way, this is full remote code execution.
      Use ast.literal_eval() for parsing literals, or a proper expression
      parser/sandboxed evaluator for anything more complex.
    metadata:
      cwe: "CWE-95"
      category: injection
      hazard_point: 10
    patterns:
      - pattern: eval(...)
      - pattern-not: eval("...")

  - id: exec-on-input
    languages: [python]
    severity: ERROR
    message: >-
      exec() executes arbitrary Python code/statements. If the argument is
      influenced by external input, this is remote code execution.
    metadata:
      cwe: "CWE-95"
      category: injection
      hazard_point: 10
    patterns:
      - pattern: exec($CODE)
      - pattern-not: exec("...")

  - id: insecure-deserialization-pickle
    languages: [python]
    severity: ERROR
    message: >-
      pickle.loads()/pickle.load() can execute arbitrary code during
      deserialization of untrusted data (CWE-502). If this byte stream ever
      originates from a network request, file upload, or any source you do
      not fully control, this is remote code execution. Use JSON or another
      data-only format for anything crossing a trust boundary.
    metadata:
      cwe: "CWE-502"
      category: injection
      hazard_point: 9
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: cPickle.loads(...)

  - id: insecure-yaml-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load() without an explicit safe Loader (or with Loader=yaml.Loader
      / yaml.UnsafeLoader) can instantiate arbitrary Python objects from the
      input, leading to code execution on untrusted YAML. Use
      yaml.safe_load() instead.
    metadata:
      cwe: "CWE-502"
      category: injection
      hazard_point: 8
    patterns:
      - pattern-either:
          - pattern: yaml.load($DATA)
          - pattern: yaml.load($DATA, Loader=yaml.Loader)
          - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($DATA, Loader=yaml.FullLoader)

  - id: xxe-lxml-resolve-entities
    languages: [python]
    severity: ERROR
    message: >-
      lxml parser configured with resolve_entities=True (or default-enabled
      entity resolution) is vulnerable to XML External Entity (XXE) attacks,
      which can read local files or trigger SSRF. Set resolve_entities=False
      and no_network=True on the XMLParser.
    metadata:
      cwe: "CWE-611"
      category: injection
      hazard_point: 8
    patterns:
      - pattern: etree.XMLParser(..., resolve_entities=True, ...)
