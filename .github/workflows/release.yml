# Lives in the CodeScan ENGINE repo (this repo) at .github/workflows/release.yml
#
# Publishes the engine image to GHCR whenever a version tag (v1.2.3-style)
# is pushed. Pushes BOTH the exact tag and the moving major-version tag, so
# consumers pinning to `:v1` automatically get bugfixes without ever
# picking up a breaking v2 change — same convention used by
# actions/checkout, docker/build-push-action, and most published GitHub
# Actions.
#
# This workflow does NOT run on every push to main — only on tags — so
# in-progress work on main never accidentally publishes a half-finished
# image that consumer repos would pull on their next PR scan.
#
# ZoneScan notes
# --------------
# The base image includes numpy (required for centroid similarity math) but
# NOT torch or transformers — those add ~800 MB and are only needed for the
# real embedding model (M2+). The test suite runs ZoneScan with the
# deterministic hash-based stub embedder, so no GPU or ML deps are needed
# in this CI job.
#
# For M2+ a separate `:zonescan` image tag (with torch + transformers) will
# be built by a future workflow variant. That image will be gated behind the
# same test suite plus an additional `--zone-detect` integration smoke test
# against tests/repo/payment_service.py.

name: Build and publish engine image

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite before publishing
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
          # numpy is now a base runtime dep (zonescan centroid similarity).
          # requirements.txt already pins it — this pip install is a no-op
          # if requirements.txt was fully installed above, but made explicit
          # here as documentation of the dependency boundary.
          pip install numpy
          pytest tests/ -v
        # Deliberately a hard gate: a tag that doesn't pass the test suite
        # never reaches GHCR. This is the same role the deck's "CI gate
        # blocks merge on unresolved CRITICAL" plays for consumer repos —
        # here it's the engine repo refusing to publish a broken image.
        #
        # ZoneScan tests run with the stub embedder (no torch/transformers
        # needed) and cover: chunker, embedder stub, CWE index, zone_detector
        # end-to-end, hazard score, and dedup correctness.

      - name: Extract version from tag
        id: version
        run: |
          FULL_TAG="${GITHUB_REF_NAME}"          # e.g. v1.3.0
          MAJOR_TAG="${FULL_TAG%%.*}"             # e.g. v1
          # Docker requires repository names to be strictly lowercase
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "full=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR_TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (base — no ML deps)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # multi-arch build so the image works on both Intel and ARM
          # GitHub-hosted/self-hosted runners without a separate manifest
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/codescan:${{ steps.version.outputs.full }}
            ghcr.io/${{ steps.version.outputs.owner }}/codescan:${{ steps.version.outputs.major }}
          # ZONESCAN_VARIANT=base — includes numpy but NOT torch/transformers.
          # ZoneScan runs with the stub embedder at the real similarity threshold
          # (no candidates will pass unless the real model is mounted at runtime).
          # Pass --zone-detect to enable; the scanner degrades gracefully.
          build-args: |
            ZONESCAN_VARIANT=base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Published engine image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Purpose |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`ghcr.io/${{ steps.version.outputs.owner }}/codescan:${{ steps.version.outputs.full }}\` | Exact release tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`ghcr.io/${{ steps.version.outputs.owner }}/codescan:${{ steps.version.outputs.major }}\` | Moving major tag (now points here) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**ZoneScan:** included with stub embedder (base image). Use \`--zone-detect\` flag to enable. Real embedding model (M2+) requires the \`:zonescan\` image variant." >> "$GITHUB_STEP_SUMMARY"
